[package]
name = "omacell-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "AI providers, workbook card, redaction, and agent loop for Omacell."

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
omacell-conf = { path = "../conf", version = "0.0.0" }
omacell-core = { path = "../core", version = "0.0.0" }
regex = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
tracing = "0.1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
