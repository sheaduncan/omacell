[package]
name = "omacell-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Command-line entry point for Omacell."

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
omacell-ai = { path = "../ai", version = "0.0.0" }
omacell-bus = { path = "../bus", version = "0.0.0" }
omacell-conf = { path = "../conf", version = "0.0.0" }
toml = "0.8"
omacell-core = { path = "../core", version = "0.0.0" }
omacell-fn = { path = "../fn", version = "0.0.0" }
omacell-io = { path = "../io", version = "0.0.0" }
omacell-lua = { path = "../lua", version = "0.0.0" }
omacell-gui = { path = "../gui", version = "0.0.0" }
omacell-tui = { path = "../tui", version = "0.0.0" }
omacell-ui = { path = "../ui", version = "0.0.0" }
rmcp = { version = "3.1", default-features = false, features = ["server", "client", "transport-io", "transport-async-rw", "transport-child-process", "schemars"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
async-trait = "0.1"
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"

[[bin]]
name = "omacell"
path = "src/main.rs"
