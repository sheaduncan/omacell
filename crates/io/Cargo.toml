[package]
name = "omacell-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Workbook file formats (xlsx, csv, omc, ods, …) for Omacell."

[lints]
workspace = true

[dependencies]
csv = "1"
encoding_rs = "0.8"
indexmap = { workspace = true }
omacell-core = { path = "../core", version = "0.0.0" }
quick-xml = "0.41"
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
calamine = "0.35"
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "csv_parse"
harness = false

[[bench]]
name = "xlsx_open"
harness = false

[[bench]]
name = "xlsx_save"
harness = false
