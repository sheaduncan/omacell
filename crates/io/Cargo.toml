[package]
name = "omacell-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Workbook file formats (xlsx, csv, omc, ods, …) for Omacell."

[lints]
workspace = true

[dependencies]
arrow = { version = "59", default-features = false }
bytes = "1"
calamine = "0.36"
csv = "1"
encoding_rs = "0.8"
indexmap = { workspace = true }
omacell-core = { path = "../core", version = "0.0.0" }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "flate2-rust_backend"] }
pdf-writer = "0.12"
quick-xml = { version = "0.41", features = ["escape-html"] }
resvg = "0.48"
tiny-skia = "0.12"
ttf-parser = "0.25"
usvg = "0.48"
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "csv_parse"
harness = false

[[bench]]
name = "xlsx_open"
harness = false

[[bench]]
name = "xlsx_save"
harness = false
