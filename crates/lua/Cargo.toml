[package]
name = "omacell-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Sandboxed Lua 5.4 scripting surface for Omacell."

[lints]
workspace = true

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }
omacell-ai = { path = "../ai", version = "0.0.0" }
omacell-bus = { path = "../bus", version = "0.0.0" }
schemars = { workspace = true }
omacell-conf = { path = "../conf", version = "0.0.0" }
omacell-core = { path = "../core", version = "0.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
async-trait = "0.1"
omacell-fn = { path = "../fn", version = "0.0.0" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
