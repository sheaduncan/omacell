name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny

      - name: Host tools for cross-checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc python3-openpyxl

      - name: just check
        run: just check

      - name: cargo deny
        run: cargo deny check

      - name: Criterion smoke
        run: cargo test --workspace --benches
