name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-28
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install just, cargo-audit, and cargo-deny
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: just,cargo-audit,cargo-deny,cargo-fuzz

      - name: Host tools for cross-checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc python3-openpyxl mesa-vulkan-drivers

      - name: just check
        run: just check

      - name: Generated manual drift
        run: just docs-check

      - name: Fluent extraction drift
        run: just i18n-check

      - name: Release budget manifest
        run: python3 scripts/check-perf-baselines.py

      - name: cargo deny
        run: |
          cargo deny check --hide-inclusion-graph
          cargo deny --manifest-path fuzz/Cargo.toml check --hide-inclusion-graph
          cargo deny --manifest-path spikes/grid-egui/Cargo.toml check --hide-inclusion-graph
          cargo deny --manifest-path spikes/ironcalc/Cargo.toml check --hide-inclusion-graph

      - name: cargo audit
        run: cargo audit

      - name: Criterion smoke
        run: cargo test --workspace --benches

      - name: Compile every fuzz target
        run: |
          rustup toolchain install nightly-2026-08-28 --profile minimal
          cargo +nightly-2026-08-28 fuzz build --target x86_64-unknown-linux-gnu
