name: Fixed-host performance

on:
  schedule:
    - cron: "23 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-host:
    name: Framework 13 integrated-GPU gates
    runs-on: [self-hosted, linux, x64, framework-13, integrated-gpu]
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/omacell-perf-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-28
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate complete 10 percent budget table
        run: python3 scripts/check-perf-baselines.py

      - name: Initialize fresh measurement log
        run: |
          : > "$RUNNER_TEMP/perf-measurements.log"

      - name: Fixed-adapter render and readback measurements
        env:
          OMACELL_FIXED_GPU: "1"
        run: |
          cargo test --release -p omacell-gui --test a11y \
            first_frame_renders_within_software_ci_smoke_budget -- --ignored --exact --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/perf-measurements.log"
          cargo test --release -p omacell-gui --test performance -- --ignored --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/perf-measurements.log"
          cargo test --release -p omacell-tui --test snapshots \
            first_frame_completes -- --ignored --exact --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/perf-measurements.log"

      - name: Numeric-cell resident memory
        run: |
          cargo test --release -p omacell-core --test memory \
            million_by_twenty_numeric_at_most_64_bytes_per_cell \
            -- --ignored --exact --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/perf-measurements.log"

      - name: Engine and I/O measurements
        run: |
          cargo bench -p omacell-core --bench recalc -- --save-baseline release
          cargo bench -p omacell-io --bench csv_parse --bench xlsx_open --bench xlsx_save -- \
            --save-baseline release
          cargo bench -p omacell-conf --bench theme_reload -- --save-baseline release
          cargo bench -p omacell-ai --bench card -- --save-baseline release

      - name: Live local and cloud model measurements
        env:
          OMACELL_FIXED_PERF: "1"
          OMACELL_PERF_LOCAL_ENDPOINT: ${{ vars.OMACELL_PERF_LOCAL_ENDPOINT || 'http://127.0.0.1:11434/v1' }}
          OMACELL_PERF_LOCAL_MODEL: ${{ vars.OMACELL_PERF_LOCAL_MODEL || 'qwen2.5:0.5b' }}
          OMACELL_PERF_CLOUD_ENDPOINT: ${{ vars.OMACELL_PERF_CLOUD_ENDPOINT }}
          OMACELL_PERF_CLOUD_MODEL: ${{ vars.OMACELL_PERF_CLOUD_MODEL }}
          OMACELL_PERF_CLOUD_TOKEN: ${{ secrets.OMACELL_PERF_CLOUD_TOKEN }}
        run: |
          curl --fail --silent --show-error "$OMACELL_PERF_LOCAL_ENDPOINT/models" >/dev/null
          cargo bench -p omacell-ai --bench live_model \
            2>&1 | tee -a "$RUNNER_TEMP/perf-measurements.log"

      - name: Produce and validate fresh fixed-host results
        shell: bash
        run: |
          python3 scripts/collect-perf-results.py \
            --log "$RUNNER_TEMP/perf-measurements.log" \
            --criterion-root "$CARGO_TARGET_DIR/criterion" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/perf-results.json"
          python3 scripts/check-perf-baselines.py \
            "$RUNNER_TEMP/perf-results.json" \
            --expect-commit "$GITHUB_SHA" \
            --expect-run-id "$GITHUB_RUN_ID" \
            --max-age-hours 6

      - name: Upload fixed-host evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixed-host-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/perf-results.json
          if-no-files-found: error
          retention-days: 90
