name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  nightly:
    name: fuzz-and-ignored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly 2026-08-28
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz

      - name: Ignored / large-file tests
        run: cargo +nightly test --workspace -- --ignored

      - name: Fuzz targets (10 minutes each)
        run: |
          if [[ -f fuzz/Cargo.toml ]]; then
            for t in $(cargo fuzz list); do
              cargo fuzz run "$t" -- -max_total_time=600
            done
          else
            echo "No fuzz targets yet; skip."
          fi
