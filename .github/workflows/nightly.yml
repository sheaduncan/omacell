name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  nightly:
    name: fuzz-and-ignored
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly 2026-08-28
        with:
          toolchain: nightly-2026-08-28
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz

      - name: Install cargo-deny
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny

      - name: Dependency policy
        run: cargo deny check

      - name: Ignored / large-file tests
        run: cargo +nightly-2026-08-28 test --workspace -- --ignored

      - name: GUI software-render performance gate
        run: cargo +nightly-2026-08-28 test --release -p omacell-gui --test performance -- --ignored --nocapture

      - name: Conditional-format performance gate
        run: cargo +nightly-2026-08-28 test --release -p omacell-core --test data_tools cf_eval_100k_cells_20_rules_is_under_100ms -- --ignored --exact --nocapture

      - name: Fuzz targets (10 minutes each)
        run: |
          mapfile -t fuzz_targets < <(cargo +nightly-2026-08-28 fuzz list)
          test "${#fuzz_targets[@]}" -gt 0
          cargo +nightly-2026-08-28 fuzz build --target x86_64-unknown-linux-gnu
          for target in "${fuzz_targets[@]}"; do
            cargo +nightly-2026-08-28 fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=600
          done

  local-model-evals:
    name: local-model-evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-28
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Start loopback model
        run: |
          docker run -d --name omacell-ollama -p 11434:11434 ollama/ollama
          for _ in {1..120}; do
            if curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null
          docker exec omacell-ollama ollama pull qwen2.5:0.5b

      - name: Score WP-23 eval suite
        env:
          OMACELL_LOCAL_EVAL_ENDPOINT: http://127.0.0.1:11434/v1
          OMACELL_LOCAL_EVAL_MODEL: qwen2.5:0.5b
        run: cargo test -p omacell-ai --test local_model_eval -- --ignored --nocapture
