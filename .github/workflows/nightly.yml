name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  nightly:
    name: fuzz-and-ignored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly 2026-08-28
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz

      - name: Ignored / large-file tests
        run: cargo +nightly test --workspace -- --ignored

      - name: GUI software-render performance gate
        run: cargo +nightly test --release -p omacell-gui --test performance -- --ignored --nocapture

      - name: Fuzz targets (10 minutes each)
        run: |
          if [[ -f fuzz/Cargo.toml ]]; then
            for t in $(cargo +nightly fuzz list); do
              cargo +nightly fuzz run "$t" -- -max_total_time=600
            done
          else
            echo "No fuzz targets yet; skip."
          fi
