# Classic (Excel-compatible) keymap from spec Appendix A.1.
# WP-14 may add remaining chords; this file is the Appendix A map, not an excerpt.
[meta]
name = "classic"
model = "classic"

[bindings]
"Ctrl+Z" = "edit.undo"
"Ctrl+Y" = "edit.redo"
"Ctrl+X" = "edit.cut"
"Ctrl+C" = "edit.copy"
"Ctrl+V" = "edit.paste"
"Delete" = "edit.clearcell"
"F2" = "edit.cell"
"Esc" = "edit.cancel"
"F9" = "calc.recalc"
"Ctrl+S" = "file.save"
"Ctrl+O" = "file.open"
"Ctrl+N" = "file.new"
"Ctrl+P" = "file.print"
"Ctrl+F" = "edit.find"
"Ctrl+H" = "edit.replace"
"Ctrl+1" = "format.panel"
"Ctrl+B" = "format.bold"
"Ctrl+I" = "format.italic"
"Ctrl+U" = "format.underline"
"Ctrl+T" = "table.create"
"Ctrl+K" = "edit.hyperlink"
"F1" = "help.keys"
"Ctrl+Shift+P" = "palette.open"
"Ctrl+Shift+A" = "ai.plan"
"Ctrl+Shift+X" = "ai.assist"
"Ctrl+Shift+R" = "changeset.review"
"F5" = "nav.goto"
"Ctrl+G" = "nav.goto"
"Ctrl+Home" = "nav.a1"
"Tab" = "nav.right"
"Enter" = "nav.enter"
"Shift+Enter" = "nav.enterup"
"Ctrl+Enter" = "edit.fillselection"
"Ctrl+D" = "edit.filldown"
"Ctrl+R" = "edit.fillright"
"Alt+=" = "edit.autosum"
"F11" = "chart.fromselection"
"Ctrl+W" = "file.close"
"F12" = "file.saveas"
"Left" = "nav.left"
"Right" = "nav.right"
"Up" = "nav.up"
"Down" = "nav.down"
"Shift+Left" = "sel.extendleft"
"Shift+Right" = "sel.extendright"
"Shift+Up" = "sel.extendup"
"Shift+Down" = "sel.extenddown"
"Ctrl+Shift+Left" = "sel.edgeleft"
"Ctrl+Shift+Right" = "sel.edgeright"
"Ctrl+Shift+Up" = "sel.edgeup"
"Ctrl+Shift+Down" = "sel.edgedown"
"Ctrl+Left" = "nav.prevedge"
"Ctrl+Right" = "nav.nextedge"
"Ctrl+Up" = "nav.edgeup"
"Ctrl+Down" = "nav.edgedown"
"Home" = "nav.firstcol"
"End" = "nav.lastcol"
"Ctrl+End" = "nav.bottom"
"PgUp" = "nav.pageup"
"PgDn" = "nav.pagedown"
"Alt+PgUp" = "nav.pageleft"
"Alt+PgDn" = "nav.pageright"
"Ctrl+PgUp" = "sheet.prev"
"Ctrl+PgDn" = "sheet.next"
"Shift+Tab" = "nav.left"
"F4" = "edit.cycleanchor"
"Shift+F9" = "calc.recalc"
"Ctrl+Alt+F9" = "calc.recalc"
"Ctrl+E" = "edit.flashfill"
"Ctrl+Alt+V" = "edit.pastespecial"
"Ctrl+-" = "edit.delcells"
"Ctrl+Shift+=" = "edit.insert"
"Ctrl+9" = "view.hiderows"
"Ctrl+0" = "view.hidecols"
"Ctrl+Shift+9" = "view.unhiderows"
"Ctrl+Shift+0" = "view.unhidecols"
"Ctrl+Space" = "sel.col"
"Shift+Space" = "sel.row"
"Ctrl+A" = "sel.regionall"
"Ctrl+*" = "sel.regionall"
"F8" = "sel.extendmode"
"Shift+F8" = "sel.addmode"
"Ctrl+Shift+L" = "filter.toggle"
"Shift+F2" = "edit.note"
"Ctrl+F3" = "name.manager"
"F3" = "name.paste"
"Ctrl+Shift+F3" = "name.createfrom"
"Alt+Shift+Right" = "edit.group"
"Alt+Shift+Left" = "edit.ungroup"
"Ctrl+Shift+E" = "edit.explainerror"
"Ctrl+Alt+=" = { cmd = "view.zoom", args = { delta = 0.1 } }
"Ctrl+Alt+-" = { cmd = "view.zoom", args = { delta = -0.1 } }
"Ctrl+Alt+0" = { cmd = "view.zoom", args = { factor = 1.0 } }
"Ctrl+Shift+U" = "view.formulabar"
"Ctrl+`" = "view.formulas"
"Ctrl+;" = "edit.insertdate"
"Ctrl+Shift+;" = "edit.inserttime"
"Ctrl+'" = "edit.copyformulaabove"
"Ctrl+Shift+\"" = "edit.copyvalueabove"
"Ctrl+Shift+~" = "format.general"
"Ctrl+Shift+!" = "format.numberstyle"
"Ctrl+Shift+@" = "format.time"
"Ctrl+Shift+#" = "format.date"
"Ctrl+Shift+$" = "format.currency"
"Ctrl+Shift+%" = "format.percent"
"Ctrl+Shift+^" = "format.scientific"
"Ctrl+Shift+&" = "format.borderoutline"
"Ctrl+Shift+_" = "format.bordernone"
