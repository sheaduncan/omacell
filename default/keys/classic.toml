# Classic (Excel-compatible) keymap from spec Appendix A.1.
# WP-14 may add remaining chords; this file is the Appendix A map, not an excerpt.
[meta]
name = "classic"
model = "classic"

[bindings]
"Ctrl+Z" = "edit.undo"
"Ctrl+Y" = "edit.redo"
"Ctrl+X" = "edit.cut"
"Ctrl+C" = "edit.copy"
"Ctrl+V" = "edit.paste"
"Delete" = "cell.clear"
"F2" = "edit.cell"
"Esc" = "edit.cancel"
"F9" = "calc.recalc"
"Ctrl+S" = "file.save"
"Ctrl+O" = "file.open"
"Ctrl+N" = "file.new"
"Ctrl+P" = "file.print"
"Ctrl+F" = "edit.find"
"Ctrl+H" = "edit.replace"
"Ctrl+1" = "format.panel"
"Ctrl+B" = "format.bold"
"Ctrl+I" = "format.italic"
"Ctrl+U" = "format.underline"
"Ctrl+T" = "table.create"
"Ctrl+K" = "edit.hyperlink"
"F1" = "help.keys"
"Ctrl+Shift+P" = "palette.open"
"Ctrl+Shift+A" = "ai.plan"
"Ctrl+Shift+X" = "ai.assist"
"Ctrl+Shift+R" = "changeset.review"
"F5" = "nav.goto"
"Ctrl+G" = "nav.goto"
"Ctrl+Home" = "nav.a1"
"Tab" = "nav.right"
"Enter" = "nav.enter"
"Shift+Enter" = "nav.enter_up"
"Ctrl+Enter" = "edit.fill_selection"
"Ctrl+D" = "edit.fill_down"
"Ctrl+R" = "edit.fill_right"
"Alt+=" = "edit.autosum"
"F11" = "chart.from_selection"
"Ctrl+W" = "file.close"
"F12" = "file.save_as"
