# Modal (Vim-style) keymap from spec Appendix A.2.
[meta]
name = "modal"
model = "modal"
leader = "Space"

[bindings.normal]
h = "nav.left"
j = "nav.down"
k = "nav.up"
l = "nav.right"
gg = "nav.top"
G = "nav.bottom"
"0" = "nav.firstcol"
"$" = "nav.lastcol"
w = "nav.nextedge"
b = "nav.prevedge"
i = "edit.cell"
a = "edit.append"
"=" = "edit.formula"
Enter = "edit.cell"
x = "cell.clear"
dd = "edit.clearrow"
u = "edit.undo"
"Ctrl+r" = "edit.redo"
"." = "edit.repeat"
v = "sel.visual"
V = "sel.visualrow"
"Ctrl+v" = "sel.visualcol"
"/" = "edit.search"
n = "edit.searchnext"
N = "edit.searchprev"
gt = "sheet.next"
gT = "sheet.prev"
zf = "view.freeze"
zs = "view.split"
zz = "view.center"
H = "nav.top"
M = "nav.a1"
L = "nav.bottom"
"Ctrl+d" = "nav.pagedown"
"Ctrl+u" = "nav.pageup"
yy = "edit.yank"
p = "edit.paste"
P = "edit.paste"
dr = "edit.delcells"
dc = "edit.delcells"
ir = "edit.insert"
ic = "edit.insert"
yr = "edit.yank"
yc = "edit.yank"
"<leader>a" = "ai.plan"
"<leader>x" = "ai.assist"
"<leader>c" = "changeset.review"
"<leader>g" = "ai.agent"
":" = "command.line"
"Ctrl+f" = "nav.pagedown"
"Ctrl+b" = "nav.pageup"

[bindings.visual]
d = "edit.delete"
y = "edit.yank"
c = "edit.change"

[bindings.insert]
Esc = "mode.normal"
"Ctrl+[" = "mode.normal"
Enter = "edit.commit"
F4 = "edit.cycleanchor"

[bindings.command]
Esc = "mode.normal"
Enter = "edit.commit"
