# cargo-deny configuration for Omacell (WP-00).
# License allowlist matches AGENTS.md. GPL-family licenses are denied
# by omission from `allow`.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained `ttf-parser` (info). Direct dep for WP-26 PDF embedding and
    # transitive via egui's `owned_ttf_parser`; neither path has a replacement yet.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    # Mozilla root certificates bundled by `webpki-roots` via pre-approved
    # `reqwest` rustls-tls (WP-22). Permissive data license, not GPL-family.
    "CDLA-Permissive-2.0",
    # Bundled egui/epaint default fonts (WP-16). SIL OFL and Ubuntu Font
    # License 1.0 are font licenses, not GPL-family.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
