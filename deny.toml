# cargo-deny configuration for Omacell (WP-00).
# License allowlist matches AGENTS.md. GPL-family licenses are denied
# by omission from `allow`.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
yanked = "deny"
ignore = [
    # Transitive via calamine (dev-only). Runtime `omacell-io` uses quick-xml 0.41.
    # Remove when calamine ≥ 0.36 is allowed by the workspace MSRV.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Transitive via pre-approved `fontdb` 0.23 (WP-12). Remove when fontdb
    # switches to skrifa.
    "RUSTSEC-2026-0192",
    # Transitive via pre-approved `ratatui` 0.29 (WP-15). `paste` is unmaintained
    # (RUSTSEC-2024-0436). ratatui ≥ 0.30 needs rustc 1.88, above the workspace
    # MSRV 1.85. Remove when MSRV allows the upgrade.
    "RUSTSEC-2024-0436",
    # Transitive via pre-approved `resvg`/`usvg` 0.45 (WP-25). `rustybuzz` is
    # unmaintained (RUSTSEC-2026-0206). Remove when resvg switches off rustybuzz.
    "RUSTSEC-2026-0206",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    # Mozilla root certificates bundled by `webpki-roots` via pre-approved
    # `reqwest` rustls-tls (WP-22). Permissive data license, not GPL-family.
    "CDLA-Permissive-2.0",
    # Bundled egui/epaint default fonts (WP-16). SIL OFL and Ubuntu Font
    # License 1.0 are font licenses, not GPL-family.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
