[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["Shea Duncan <s.shea.duncan@gmail.com>"]
publish = false
repository = "https://github.com/sheaduncan/omacell"
homepage = "https://github.com/sheaduncan/omacell"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
