[package]
name = "omacell-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.omacell-core]
path = "../crates/core"

[dependencies.omacell-fn]
path = "../crates/fn"

[dependencies.omacell-bus]
path = "../crates/bus"

[dependencies.omacell-io]
path = "../crates/io"

[dependencies.zip]
version = "2"
default-features = false
features = ["deflate"]

[[bin]]
name = "parse_formula"
path = "fuzz_targets/parse_formula.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_numfmt"
path = "fuzz_targets/parse_numfmt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fn_eager"
path = "fuzz_targets/fn_eager.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv_parse"
path = "fuzz_targets/csv_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_zip"
path = "fuzz_targets/xlsx_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_sheet_xml"
path = "fuzz_targets/xlsx_sheet_xml.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
