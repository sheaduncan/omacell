[package]
name = "omacell-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.omacell-core]
path = "../crates/core"
version = "0.0.0"

[dependencies.omacell-fn]
path = "../crates/fn"
version = "0.0.0"
features = ["fuzzing"]

[dependencies.omacell-ai]
path = "../crates/ai"
version = "0.0.0"

[dependencies.omacell-bus]
path = "../crates/bus"
version = "0.0.0"

[dependencies.omacell-io]
path = "../crates/io"
version = "0.0.0"

[dependencies.omacell-xls-worker]
path = "../crates/xls-worker"
version = "0.0.0"

[dependencies.omacell-cli]
path = "../crates/cli"
version = "0.0.0"

[dependencies.omacell-conf]
path = "../crates/conf"
version = "0.0.0"

[dependencies.omacell-lua]
path = "../crates/lua"
version = "0.0.0"

[dependencies.omacell-ui]
path = "../crates/ui"
version = "0.0.0"

[dependencies.serde_json]
version = "1"

[dependencies.toml]
version = "0.8"

[dependencies.zip]
version = "2"
default-features = false
features = ["deflate"]

[[bin]]
name = "parse_formula"
path = "fuzz_targets/parse_formula.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_numfmt"
path = "fuzz_targets/parse_numfmt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_numeric_text"
path = "fuzz_targets/parse_numeric_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pivot_calc"
path = "fuzz_targets/pivot_calc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fn_eager"
path = "fuzz_targets/fn_eager.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv_parse"
path = "fuzz_targets/csv_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_zip"
path = "fuzz_targets/xlsx_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_sheet_xml"
path = "fuzz_targets/xlsx_sheet_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "omc_parse"
path = "fuzz_targets/omc_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_args"
path = "fuzz_targets/cli_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_json"
path = "fuzz_targets/mcp_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parsers"
path = "fuzz_targets/config_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "other_formats"
path = "fuzz_targets/other_formats.rs"
test = false
doc = false
bench = false

[[bin]]
name = "application_parsers"
path = "fuzz_targets/application_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lua_runtime"
path = "fuzz_targets/lua_runtime.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
